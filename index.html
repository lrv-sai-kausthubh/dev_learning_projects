<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- added score container in case i want to add more div in html i can add that-->
    <div class="score_container">

        <div class="score_display">
            <!-- HOME -->
            <div class="center">
                <h2>HOME</h2>
                <h1 id="home_score">0</h1>

                <div class="buttonzz" id="home_group">
                    <button class="add_btn">+1</button>
                    <button class="add_btn">+2</button>
                    <button class="add_btn">+3</button>
                </div>

                <p id="home_lead"></p>
            </div>

            <!-- GUEST -->
            <div class="center">
                <h2>GUEST</h2>
                <h1 id="guest_score">0</h1>

                <div class="buttonzz" id="guest_group">
                    <button class="add_btn">+1</button>
                    <button class="add_btn">+2</button>
                    <button class="add_btn">+3</button>
                </div>
                <p id="guest_lead"></p>
            </div>


        </div>

        <div class="center">
            <button class="reset_btn" id="reset_btn">Reset</button>
        </div>

    </div>
    <script src="index.js"></script>
</body>
</html>
